<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCheck - Your Zurich Activity Finder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%235D5CDE' d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79-4-4-4z'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                        secondary: '#7C4DFF',
                        dark: '#1A1A2E',
                        accent: '#34D399'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #5D5CDE 0%, #7C4DFF 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .mood-button {
            transition: all 0.3s ease;
        }
        .mood-button:hover {
            transform: scale(1.05);
        }
        .mood-button.selected {
            background: #5D5CDE;
            color: white;
            transform: scale(1.1);
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-dark text-gray-900 dark:text-white min-h-screen font-sans">
    <!-- Header -->
    <header class="gradient-bg text-white p-6 text-center">
        <h1 class="text-3xl font-bold mb-2">VibeCheck</h1>
        <p class="text-blue-100 text-sm">Discover mood-based activities in Zurich</p>
        <div class="mt-4 text-sm text-blue-100">
            📍 <span id="location">Zurich, Switzerland</span> • 
            <span id="current-time"></span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Language Toggle -->
        <div class="flex justify-end mb-4">
            <select id="language-toggle" class="bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white p-2 rounded-lg text-sm">
                <option value="en">English</option>
                <option value="de">Deutsch</option>
            </select>
        </div>

        <!-- Price Filter -->
        <div class="mb-6">
            <label for="price-filter" class="text-sm font-medium text-gray-700 dark:text-gray-300">Filter by Price (CHF):</label>
            <select id="price-filter" class="ml-2 bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white p-2 rounded-lg text-sm">
                <option value="all">All</option>
                <option value="free">Free</option>
                <option value="0-20">0–20 CHF</option>
                <option value="20-50">20–50 CHF</option>
                <option value="50+">50+ CHF</option>
            </select>
        </div>

        <!-- Mood Selection -->
        <section id="mood-selection" class="mb-8">
            <h2 class="text-2xl font-semibold mb-4 text-center">What's your vibe today?</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                <button class="mood-button p-4 rounded-xl border-2 border-gray-200 dark:border-gray-700 text-center" data-mood="chill">
                    <div class="text-2xl mb-2">☕</div>
                    <div class="font-medium">Chill</div>
                    <div class="text-xs text-gray-600 dark:text-gray-400">Relax & unwind</div>
                </button>
                <button class="mood-button p-4 rounded-xl border-2 border-gray-200 dark:border-gray-700 text-center" data-mood="adventurous">
                    <div class="text-2xl mb-2">🎯</div>
                    <div class="font-medium">Adventurous</div>
                    <div class="text-xs text-gray-600 dark:text-gray-400">Try something new</div>
                </button>
                <button class="mood-button p-4 rounded-xl border-2 border-gray-200 dark:border-gray-700 text-center" data-mood="social">
                    <div class="text-2xl mb-2">👥</div>
                    <div class="font-medium">Social</div>
                    <div class="text-xs text-gray-600 dark:text-gray-400">Meet & connect</div>
                </button>
                <button class="mood-button p-4 rounded-xl border-2 border-gray-200 dark:border-gray-700 text-center" data-mood="cultural">
                    <div class="text-2xl mb-2">🎨</div>
                    <div class="font-medium">Cultural</div>
                    <div class="text-xs text-gray-600 dark:text-gray-400">Art & history</div>
                </button>
            </div>
        </section>

        <!-- Loading State -->
        <section id="loading" class="hidden text-center py-12">
            <div class="pulse-animation text-4xl mb-4">🔍</div>
            <h3 class="text-xl font-semibold mb-2">Finding your perfect vibe...</h3>
            <p class="text-gray-600 dark:text-gray-400">Checking what's happening nearby</p>
        </section>

        <!-- Activity Suggestions -->
        <section id="suggestions" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-semibold">Perfect for You</h2>
                <button id="refresh-btn" class="text-primary font-medium hover:underline">Refresh</button>
            </div>
            <div id="activity-list" class="space-y-4"></div>
            <div class="mt-8 p-4 bg-gray-100 dark:bg-gray-800 rounded-xl text-center">
                <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">⏰ Suggestions valid for the next 2 hours</p>
                <button id="new-mood-btn" class="text-primary font-medium text-sm hover:underline">Choose different mood</button>
            </div>
        </section>

        <!-- Footer -->
        <footer class="mt-12 text-center text-sm text-gray-600 dark:text-gray-400">
            <p>© 2025 VibeCheck. All rights reserved.</p>
            <div class="mt-2 flex justify-center space-x-4">
                <a href="https://x.com/intent/tweet?text=Check%20out%20VibeCheck%20for%20awesome%20Zurich%20activities!&url=https://timo0909.github.io/VibeCheck" target="_blank" class="text-primary hover:underline">Share on X</a>
                <a href="https://www.instagram.com" target="_blank" class="text-primary hover:underline">Share on Instagram</a>
            </div>
        </footer>
    </main>

    <script>
        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            document.documentElement.classList.toggle('dark', event.matches);
        });

        // Update current time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('current-time').textContent = timeString;
        }
        updateTime();
        setInterval(updateTime, 60000);

        // Mock Instagram data (API restricted, replace with backend in production)
        const instagramData = [
            { name: "Umbrella Alley", type: "Photo Spot", distance: "1.2 km", validUntil: "2 hours", description: "Colorful umbrellas over a trendy street, perfect for Instagram", emoji: "🌂", special: "Top Instagram spot", source: "Instagram #ZurichSpots", price: 0, rating: 4.7 },
            { name: "Lindenhof Viewpoint", type: "Scenic View", distance: "0.8 km", validUntil: "2 hours", description: "Historic square with stunning city views", emoji: "🌄", special: "Trending on Instagram", source: "Instagram #VisitZurich", price: 0, rating: 4.8 }
        ];

        // Mock fallback data with Google ratings
        const fallbackActivities = {
            chill: [
                { name: "Babu’s Bakery & Coffeehouse", type: "Café", distance: "0.9 km", validUntil: "2 hours", description: "Artisanal pastries and specialty coffee", emoji: "☕", special: "Free WiFi", source: "tsri.ch", price: 10, rating: 4.5 },
                { name: "Botanical Garden Zurich", type: "Park", distance: "2.0 km", validUntil: "2 hours", description: "Tranquil gardens with exotic plants", emoji: "🌳", special: "Free entry", source: "zuerich.com", price: 0, rating: 4.6 }
            ],
            adventurous: [
                { name: "Uetliberg Trail", type: "Hiking", distance: "2.8 km", validUntil: "2 hours", description: "Scenic hike with city views", emoji: "🥾", special: "Sunset views", source: "zuerich.com", price: 0, rating: 4.7 },
                { name: "Boda Borg Zurich", type: "Adventure Game", distance: "1.7 km", validUntil: "1.5 hours", description: "Team-based physical challenges", emoji: "🔐", special: "Book online for discount", source: "eventfrog.ch", price: 35, rating: 4.4 }
            ],
            social: [
                { name: "Frau Gerolds Garten", type: "Beer Garden", distance: "1.6 km", validUntil: "2 hours", description: "Lively spot with food trucks and music", emoji: "🍻", special: "Live DJ tonight", source: "zurichunplugged.ch", price: 15, rating: 4.5 },
                { name: "Rimini Bar", type: "Bar", distance: "0.8 km", validUntil: "2 hours", description: "Open-air bar by the river", emoji: "🌆", special: "Happy hour until 20:00", source: "tsri.ch", price: 10, rating: 4.4 }
            ],
            cultural: [
                { name: "Kunsthaus Zürich", type: "Art Museum", distance: "1.3 km", validUntil: "2 hours", description: "Modern and classic art exhibitions", emoji: "🎨", special: "New Picasso exhibit", source: "zuerich.com", price: 18, rating: 4.6 },
                { name: "Zürich Street Art Tour", type: "Art Walk", distance: "1.5 km", validUntil: "2 hours", description: "Guided tour of street murals", emoji: "🎭", special: "Free with registration", source: "eventfrog.ch", price: 0, rating: 4.5 }
            ]
        };

        // DOM elements
        const moodButtons = document.querySelectorAll('.mood-button');
        const moodSection = document.getElementById('mood-selection');
        const loadingSection = document.getElementById('loading');
        const suggestionsSection = document.getElementById('suggestions');
        const activityList = document.getElementById('activity-list');
        const refreshBtn = document.getElementById('refresh-btn');
        const newMoodBtn = document.getElementById('new-mood-btn');
        const priceFilter = document.getElementById('price-filter');
        const languageToggle = document.getElementById('language-toggle');

        let selectedMood = null;
        let selectedPrice = 'all';

        // Eventbrite API fetch
        async function fetchActivities(mood) {
            const apiKey = 'YOUR_EVENTBRITE_API_KEY'; // Replace with your Eventbrite API key
            const url = `https://www.eventbriteapi.com/v3/events/search/?q=${mood}&location.address=Zurich,Switzerland&location.within=3km&token=${apiKey}`;
            try {
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${apiKey}` } });
                const data = await response.json();
                const events = data.events.map(event => ({
                    name: event.name.text,
                    type: mood.charAt(0).toUpperCase() + mood.slice(1),
                    distance: "Within 3 km",
                    validUntil: "2 hours",
                    description: event.description.text ? event.description.text.slice(0, 100) + '...' : 'Exciting event in Zurich',
                    emoji: mood === 'chill' ? '☕' : mood === 'adventurous' ? '🥾' : mood === 'social' ? '🍻' : '🎨',
                    special: event.is_free ? 'Free entry' : 'Check for discounts',
                    source: 'eventbrite.com',
                    price: event.is_free ? 0 : Math.floor(Math.random() * 50) + 10, // Mock price if not free
                    rating: 4.5 // Mock rating (replace with Google Reviews API in production)
                }));
                return [...events, ...instagramData.filter(d => d.type.toLowerCase().includes(mood))];
            } catch (error) {
                console.error('API fetch failed:', error);
                return [...(fallbackActivities[mood] || []), ...instagramData.filter(d => d.type.toLowerCase().includes(mood))];
            }
        }

        // Mood selection
        moodButtons.forEach(button => {
            button.addEventListener('click', () => {
                selectedMood = button.dataset.mood;
                selectMood(selectedMood);
            });
        });

        // Price filter
        priceFilter.addEventListener('change', () => {
            selectedPrice = priceFilter.value;
            if (selectedMood) selectMood(selectedMood);
        });

        // Language toggle (mock)
        languageToggle.addEventListener('change', (e) => {
            alert(`Switched to ${e.target.value === 'en' ? 'English' : 'Deutsch'} (Mock feature)`);
        });

        function selectMood(mood) {
            moodButtons.forEach(btn => {
                btn.classList.remove('selected');
                if (btn.dataset.mood === mood) btn.classList.add('selected');
            });
            moodSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            fetchActivities(mood).then(data => {
                setTimeout(() => showSuggestions(mood, data), 1000);
            });
        }

        function showSuggestions(mood, activities) {
            loadingSection.classList.add('hidden');
            suggestionsSection.classList.remove('hidden');
            activityList.innerHTML = '';

            const filteredActivities = activities.filter(activity => {
                if (selectedPrice === 'all') return true;
                if (selectedPrice === 'free') return activity.price === 0;
                if (selectedPrice === '0-20') return activity.price > 0 && activity.price <= 20;
                if (selectedPrice === '20-50') return activity.price > 20 && activity.price <= 50;
                if (selectedPrice === '50+') return activity.price > 50;
            });

            filteredActivities.forEach((activity, index) => {
                const activityCard = createActivityCard(activity);
                activityList.appendChild(activityCard);
                setTimeout(() => {
                    activityCard.style.opacity = '1';
                    activityCard.style.transform = 'translateY(0)';
                }, index * 150);
            });
        }

        function createActivityCard(activity) {
            const card = document.createElement('div');
            card.className = 'bg-white dark:bg-gray-800 rounded-xl p-5 shadow-lg border border-gray-100 dark:border-gray-700 card-hover cursor-pointer';
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.5s ease';
            card.innerHTML = `
                <div class="flex items-start space-x-4">
                    <div class="text-3xl">${activity.emoji}</div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold text-lg">${activity.name}</h3>
                            <span class="text-sm text-gray-500 dark:text-gray-400">${activity.distance}</span>
                        </div>
                        <p class="text-gray-600 dark:text-gray-300 text-sm mb-3">${activity.description}</p>
                        <div class="flex items-center justify-between mb-2">
                            <span class="inline-block bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-medium">${activity.type}</span>
                            <div class="text-right">
                                <div class="text-xs text-gray-500 dark:text-gray-400">Valid for ${activity.validUntil}</div>
                                <div class="text-xs text-accent font-medium">Price: ${activity.price === 0 ? 'Free' : `CHF ${activity.price}`}</div>
                                <div class="text-xs text-yellow-500 font-medium">Rating: ${activity.rating}/5</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <span class="text-xs text-purple-600 dark:text-purple-400 font-medium">💡 ${activity.source}</span>
                        </div>
                        <div class="flex space-x-2">
                            <a href="https://www.google.com/maps/search/${encodeURIComponent(activity.name + ', Zurich, Switzerland')}" 
                               target="_blank" 
                               class="flex-1 bg-primary text-white px-3 py-2 rounded-lg text-xs font-medium text-center hover:bg-primary/90 transition-colors"
                               onclick="event.stopPropagation()">📍 Directions</a>
                            <button class="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-2 rounded-lg text-xs font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
                                    onclick="event.stopPropagation(); showActivityDetails('${activity.name}')">ℹ️ Details</button>
                            <button class="flex-none bg-accent text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-accent/90 transition-colors"
                                    onclick="event.stopPropagation(); saveToFavorites('${activity.name}')">⭐ Save</button>
                        </div>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => {
                card.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    card.style.transform = 'scale(1)';
                    window.open(`https://www.google.com/maps/search/${encodeURIComponent(activity.name + ', Zurich, Switzerland')}`, '_blank');
                }, 150);
            });
            return card;
        }

        function saveToFavorites(name) {
            alert(`Saved ${name} to favorites! (In a real app, this would sync to user profile)`);
        }

        function showActivityDetails(name) {
            const allActivities = [...Object.values(fallbackActivities).flat(), ...instagramData];
            const activity = allActivities.find(a => a.name === name) || { name, description: 'Event details from Eventbrite', type: 'Event', distance: 'Within 3 km', price: 0, special: 'Check Eventbrite for details', validUntil: '2 hours', source: 'eventbrite.com', rating: 4.5 };
            alert(`${activity.name}\n\n${activity.description}\n\nType: ${activity.type}\nDistance: ${activity.distance}\nPrice: ${activity.price === 0 ? 'Free' : `CHF ${activity.price}`}\nRating: ${activity.rating}/5\nSpecial: ${activity.special}\nValid for: ${activity.validUntil}\nSource: ${activity.source}`);
        }

        // Mock notification opt-in
        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('notifications')) {
                setTimeout(() => {
                    if (confirm('Enable notifications for new activity suggestions?')) {
                        localStorage.setItem('notifications', 'enabled');
                        alert('Notifications enabled! (Mock feature)');
                    }
                }, 3000);
            }
        });
    </script>
</body>
</html>
